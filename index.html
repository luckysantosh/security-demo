<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>PhotoShare Training</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,
                "Segoe UI",Roboto,Arial,sans-serif;
}

/* ==============================
   LOGIN
============================== */

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:#fafafa;
    color:#222;
}

.loginBox{
    width:100%;
    max-width:380px;
    padding:30px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:10px;
}

.loginLogo{
    text-align:center;
    font-family:cursive;
    font-size:42px;
    font-weight:bold;
    margin-bottom:8px;
}

.trainingText{
    text-align:center;
    color:#777;
    font-size:11px;
    margin-bottom:25px;
}

input{
    width:100%;
    height:46px;
    margin-bottom:10px;
    padding:0 12px;
    border:1px solid #ddd;
    border-radius:6px;
    background:#fafafa;
    outline:none;
}

.passwordBox{
    position:relative;
}

.passwordBox input{
    padding-right:65px;
}

.showPassword{
    position:absolute;
    right:5px;
    top:0;
    height:46px;
    border:0;
    background:none;
    font-weight:bold;
}

.loginButton{
    width:100%;
    height:44px;
    border:0;
    border-radius:7px;
    color:white;
    font-weight:bold;
    background:linear-gradient(
        90deg,
        #833ab4,
        #e1306c,
        #fd1d1d,
        #f77737
    );
}

.warning{
    margin-top:18px;
    padding:12px;
    border-radius:8px;
    background:#fff7ed;
    color:#7c2d12;
    font-size:11px;
    line-height:1.5;
}


/* ==============================
   APP
============================== */

#app{
    display:none;
    min-height:100vh;
    background:#000;
}

.phone{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    background:#000;
    position:relative;
    padding-bottom:65px;
}


/* ==============================
   TOP BAR
============================== */

.topBar{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    background:#000;
    border-bottom:1px solid #171717;
    position:sticky;
    top:0;
    z-index:20;
}

.add{
    font-size:31px;
    font-weight:200;
}

.logo{
    font-family:cursive;
    font-size:29px;
    font-weight:bold;
}

.heart{
    font-size:29px;
    font-weight:200;
}


/* ==============================
   STORIES
============================== */

.stories{
    height:112px;
    display:flex;
    gap:15px;
    padding:11px 13px;
    overflow-x:auto;
    border-bottom:1px solid #151515;
}

.stories::-webkit-scrollbar{
    display:none;
}

.story{
    min-width:67px;
    text-align:center;
    font-size:11px;
    color:#eee;
    white-space:nowrap;
    overflow:hidden;
}

.storyCircle{
    width:67px;
    height:67px;
    border-radius:50%;
    padding:3px;
    margin-bottom:5px;

    background:linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
    );
}

.storyInner{
    width:100%;
    height:100%;
    border-radius:50%;
    border:3px solid #000;
    background:#252525;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:29px;
}

.yourStory{
    position:relative;
}

.plus{
    position:absolute;
    right:0;
    bottom:1px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:#fff;
    color:#000;
    border:2px solid #000;
    font-size:17px;
    line-height:17px;
}


/* ==============================
   POST
============================== */

.post{
    background:#000;
    border-bottom:1px solid #171717;
}

.postHeader{
    height:57px;
    display:flex;
    align-items:center;
    padding:7px 12px;
}

.postAvatar{
    width:39px;
    height:39px;
    border-radius:50%;
    padding:2px;

    background:linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf
    );
}

.avatarInside{
    width:100%;
    height:100%;
    border-radius:50%;
    background:#292929;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
}

.postUser{
    margin-left:9px;
    font-size:13px;
    font-weight:bold;
}

.verified{
    color:#3295ff;
}

.postMore{
    margin-left:auto;
    font-size:20px;
    letter-spacing:2px;
}


/* ==============================
   POST IMAGE
============================== */

.postImage{
    width:100%;
    aspect-ratio:1 / 1;
    background:
        linear-gradient(
            145deg,
            #101010,
            #292929 50%,

        );

    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}
