<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PhotoShare Demo</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #fafafa;
  color: #111;
}

button, input {
  font: inherit;
}

.hidden {
  display: none !important;
}

/* LOGIN */
#loginPage {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #fff;
}

.login-box {
  width: min(350px, 90%);
  border: 1px solid #ddd;
  padding: 35px 30px;
  text-align: center;
  background: white;
}

.logo {
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 30px;
}

.login-box input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border: 1px solid #ccc;
  border-radius: 5px;
  background: #fafafa;
}

.login-btn {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border: 0;
  border-radius: 7px;
  background: #1877f2;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.demo-note {
  margin-top: 20px;
  font-size: 12px;
  color: #777;
}

/* APP */
#app {
  min-height: 100vh;
}

.navbar {
  height: 60px;
  background: white;
  border-bottom: 1px solid #ddd;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav-logo {
  font-size: 23px;
  font-weight: bold;
}

.nav-actions {
  display: flex;
  gap: 18px;
  font-size: 22px;
}

.nav-actions button {
  border: 0;
  background: none;
  cursor: pointer;
}

.content {
  width: min(600px, 100%);
  margin: 20px auto;
}

/* STORIES */
.stories {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  padding: 12px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 8px;
}

.story {
  min-width: 65px;
  text-align: center;
  font-size: 11px;
}

.story-img {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: auto auto 5px;
  background: linear-gradient(135deg,#feda75,#d62976,#4f5bd5);
  color: white;
  font-size: 24px;
  border: 3px solid white;
  outline: 2px solid #d62976;
}

/* POSTS */
.post {
  background: white;
  border: 1px solid #ddd;
  margin-top: 20px;
  border-radius: 8px;
  overflow: hidden;
}

.post-header {
  display: flex;
  align-items: center;
  padding: 12px;
  gap: 10px;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg,#4f5bd5,#d62976,#feda75);
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-weight: bold;
}

.username {
  font-weight: bold;
}

.post-image {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
}

.post-actions {
  display: flex;
  gap: 17px;
  padding: 12px;
  font-size: 25px;
}

.post-actions button {
  border: 0;
  background: none;
  cursor: pointer;
}

.likes {
  padding: 0 12px 8px;
  font-weight: bold;
}

.caption {
  padding: 0 12px 15px;
}

.comment-box {
  border-top: 1px solid #eee;
  display: flex;
}

.comment-box input {
  flex: 1;
  padding: 13px;
  border: 0;
  outline: none;
}

.comment-box button {
  border: 0;
  background: white;
  color: #1877f2;
  font-weight: bold;
  padding: 0 15px;
}

/* MOBILE */
@media(max-width:600px) {
  .navbar {
    padding: 0 12px;
  }

  .content {
    margin-top: 10px;
  }

  .post {
    border-left: 0;
    border-right: 0;
    border-radius: 0;
  }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<section id="loginPage">

  <div class="login-box">

    <div class="logo">PhotoShare</div>

    <input
      id="usernameInput"
      type="text"
      placeholder="Username or email"
      autocomplete="off"
    >

    <input
      id="passwordInput"
      type="password"
      placeholder="Password"
      autocomplete="off"
    >

    <button class="login-btn" onclick="login()">
      Log In
    </button>

    <div class="demo-note">
      Demo only — no login information is transmitted.
    </div>

  </div>

</section>


<!-- MAIN APP -->
<section id="app" class="hidden">

  <nav class="navbar">

    <div class="nav-logo">
      PhotoShare
    </div>

    <div class="nav-actions">
      <button onclick="alert('Home')">⌂</button>
      <button onclick="alert('Search')">⌕</button>
      <button onclick="alert('Messages')">✉</button>
      <button onclick="logout()">↪</button>
    </div>

  </nav>


  <main class="content">

    <!-- STORIES -->
    <div class="stories">

      <div class="story">
        <div class="story-img">+</div>
        Your story
      </div>

      <div class="story">
        <div class="story-img">A</div>
        alex
      </div>

      <div class="story">
        <div class="story-img">S</div>
        sam
      </div>

      <div class="story">
        <div class="story-img">J</div>
        jordan
      </div>

      <div class="story">
        <div class="story-img">M</div>
        maya
      </div>

      <div class="story">
        <div class="story-img">R</div>
        rohan
      </div>

    </div>


    <!-- POST 1 -->
    <article class="post">

      <div class="post-header">

        <div class="avatar">A</div>

        <div>
          <div class="username">alex_demo</div>
          <small>Hyderabad</small>
        </div>

      </div>

      <img
        class="post-image"
        src="https://picsum.photos/800/800?random=10"
        alt="Demo post"
      >

      <div class="post-actions">

        <button onclick="likePost(this)">♡</button>

        <button onclick="focusComment(this)">💬</button>

        <button onclick="alert('Share demo')">➤</button>

      </div>

      <div class="likes">
        <span class="like-count">124</span> likes
      </div>

      <div class="caption">
        <b>alex_demo</b>
        Beautiful day 🌅
      </div>

      <div class="comment-box">

        <input
          type="text"
          placeholder="Add a comment..."
        >

        <button onclick="comment(this)">
          Post
        </button>

      </div>

    </article>


    <!-- POST 2 -->
    <article class="post">

      <div class="post-header">

        <div class="avatar">S</div>

        <div>
          <div class="username">sam_demo</div>
          <small>India</small>
        </div>

      </div>

      <img
        class="post-image"
        src="https://picsum.photos/800/800?random=20"
        alt="Demo post"
      >

      <div class="post-actions">

        <button onclick="likePost(this)">♡</button>

        <button onclick="focusComment(this)">💬</button>

        <button onclick="alert('Share demo')">➤</button>

      </div>

      <div class="likes">
        <span class="like-count">87</span> likes
      </div>

      <div class="caption">
        <b>sam_demo</b>
        Weekend vibes ✨
      </div>

      <div class="comment-box">

        <input
          type="text"
          placeholder="Add a comment..."
        >

        <button onclick="comment(this)">
          Post
        </button>

      </div>

    </article>


    <!-- POST 3 -->
    <article class="post">

      <div class="post-header">

        <div class="avatar">J</div>

        <div>
          <div class="username">jordan_demo</div>
          <small>Travel</small>
        </div>

      </div>

      <img
        class="post-image"
        src="https://picsum.photos/800/800?random=30"
        alt="Demo post"
      >

      <div class="post-actions">

        <button onclick="likePost(this)">♡</button>

        <button onclick="focusComment(this)">💬</button>

        <button onclick="alert('Share demo')">➤</button>

      </div>

      <div class="likes">
        <span class="like-count">213</span> likes
      </div>

      <div class="caption">
        <b>jordan_demo</b>
        Exploring new places 🌍
      </div>

      <div class="comment-box">

        <input
          type="text"
          placeholder="Add a comment..."
        >

        <button onclick="comment(this)">
          Post
        </button>

      </div>

    </article>

  </main>

</section>


<script>

/* LOGIN */

function login() {

  const username =
    document.getElementById("usernameInput").value.trim();

  if (username === "") {
    alert("Enter a demo username.");
    return;
  }

  document.getElementById("loginPage")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");
}


/* LOGOUT */

function logout() {

  document.getElementById("app")
    .classList.add("hidden");

  document.getElementById("loginPage")
    .classList.remove("hidden");

  document.getElementById("usernameInput").value = "";
  document.getElementById("passwordInput").value = "";
}


/* LIKE */

function likePost(button) {

  const post = button.closest(".post");

  const count =
    post.querySelector(".like-count");

  let number =
    parseInt(count.textContent);

  if (button.textContent === "♡") {

    button.textContent = "♥";
    count.textContent = number + 1;

  } else {

    button.textContent = "♡";
    count.textContent = number - 1;

  }
}


/* COMMENT */

function comment(button) {

  const box =
    button.parentElement;

  const input =
    box.querySelector("input");

  const text =
    input.value.trim();

  if (!text) return;

  const comment =
    document.createElement("div");

  comment.style.padding = "8px 12px";

  comment.innerHTML =
    "<b>you</b> " +
    escapeHTML(text);

  box.parentElement
    .insertBefore(comment, box);

  input.value = "";
}


/* FOCUS COMMENT */

function focusComment(button) {

  const post =
    button.closest(".post");

  const input =
    post.querySelector(".comment-box input");

  input.focus();
}


/* SECURITY */

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* ENTER KEY */

document
  .getElementById("passwordInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      login();
    }

  });

</script>

</body>
         </html>
