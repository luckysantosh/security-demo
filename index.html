<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PhotoShare</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#05070b;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

/* ================= LOGIN ================= */

#login{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 20%,#39205f,transparent 35%),
    radial-gradient(circle at 80% 80%,#42152f,transparent 35%),
    #05070b;
}

.login-card{
  width:390px;
  max-width:100%;
  padding:35px 28px;
  border:1px solid #303746;
  border-radius:28px;
  background:#101318;
  text-align:center;
  box-shadow:0 30px 80px #000;
}

.logo{
  width:82px;
  height:82px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:24px;
  font-size:45px;
  background:linear-gradient(
    135deg,
    #ffdf73,
    #ff2d75,
    #9b35ff,
    #3d8cff
  );
}

.brand{
  margin-top:15px;
  font-size:29px;
  font-weight:bold;
}

.subtitle{
  margin:8px 0 25px;
  color:#9da4b0;
  font-size:13px;
}

.login-card input{
  width:100%;
  height:52px;
  margin:7px 0;
  padding:0 15px;
  border:1px solid #343b48;
  border-radius:14px;
  background:#181c24;
  color:white;
  outline:none;
}

.login-card input:focus{
  border-color:#a23cff;
}

.primary{
  width:100%;
  height:52px;
  margin-top:10px;
  border:0;
  border-radius:14px;
  color:white;
  font-weight:bold;
  background:linear-gradient(
    100deg,
    #ff2d75,
    #9b35ff
  );
  cursor:pointer;
}

.demo{
  margin-top:15px;
  color:#737b88;
  font-size:11px;
}

/* ================= APP ================= */

#app{
  min-height:100vh;
}

.hidden{
  display:none !important;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:66px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:0 18px;

  border-bottom:1px solid #242932;

  background:#080a0eef;
  backdrop-filter:blur(20px);
}

.top-brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:bold;
}

.mini-logo{
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  font-size:22px;

  background:linear-gradient(
    135deg,
    #ffdf73,
    #ff2d75,
    #9b35ff
  );
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid #2d333e;
  border-radius:50%;
  background:#11151c;
  color:white;
  font-size:22px;
  cursor:pointer;
}

/* ================= CONTENT ================= */

.layout{
  width:min(1180px,100%);
  margin:auto;
  padding:15px 12px 90px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* ================= STORIES ================= */

.stories{
  display:flex;
  gap:15px;
  overflow-x:auto;
  padding:10px 5px 18px;
}

.stories::-webkit-scrollbar{
  display:none;
}

.story{
  min-width:75px;
  text-align:center;
  font-size:11px;
  color:#cbd0d8;
}

.avatar-ring{
  width:68px;
  height:68px;
  padding:3px;
  margin:auto auto 6px;

  border-radius:50%;

  background:linear-gradient(
    135deg,
    #ffdf73,
    #ff2d75,
    #9b35ff,
    #3d8cff
  );
}

.avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #080a0d;
}

/* ================= FEED ================= */

.feed{
  max-width:720px;
  margin:auto;
}

.post{
  margin-bottom:18px;

  background:#0e1116;
  border:1px solid #252a33;
  border-radius:18px;

  overflow:hidden;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px;
}

.post-head .avatar-ring{
  width:43px;
  height:43px;
  margin:0;
}

.post-user{
  font-size:14px;
  font-weight:bold;
}

.post-time{
  margin-top:3px;
  color:#7f8794;
  font-size:11px;
}

.more{
  margin-left:auto;
  border:0;
  background:none;
  color:#aab1bc;
  font-size:20px;
}

.post-img{
  width:100%;
  aspect-ratio:1/1;
  display:block;
  object-fit:cover;
}

.post-actions{
  display:flex;
  gap:18px;
  padding:12px 14px 5px;
}

.post-actions button{
  border:0;
  background:none;
  color:white;
  font-size:24px;
  cursor:pointer;
}

.post-actions .save{
  margin-left:auto;
}

.likes{
  padding:0 14px;
  font-size:13px;
  font-weight:bold;
}

.caption{
  padding:7px 14px 16px;
  color:#d8dce3;
  font-size:13px;
}

/* ================= SEARCH ================= */

.section-title{
  margin:10px 0 16px;
  font-size:23px;
  font-weight:bold;
}

.searchbox{
  display:flex;
  margin-bottom:15px;
}

.searchbox input{
  width:100%;
  padding:13px 15px;

  border:1px solid #2b303a;
  border-radius:14px;

  background:#151920;
  color:white;
  outline:none;
}

.explore-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}

.tile{
  aspect-ratio:1;
  overflow:hidden;
}

.tile img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ================= REELS ================= */

.reels{
  max-width:430px;
  margin:auto;
}

.reel{
  position:relative;
  height:calc(100vh - 155px);
  min-height:500px;

  margin-bottom:18px;

  border-radius:18px;
  overflow:hidden;

  background:#111;
}

.reel img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.reel-overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;

  padding:25px 18px;

  background:linear-gradient(
    transparent,
    #000d
  );
}

.reel-actions{
  position:absolute;
  right:12px;
  bottom:85px;

  display:flex;
  flex-direction:column;
  gap:12px;
}

.reel-actions button{
  width:45px;
  height:45px;

  border:0;
  border-radius:50%;

  background:#0009;
  color:white;
  font-size:20px;
}

/* ================= CREATE ================= */

.create{
  max-width:620px;
  margin:auto;
}

.create textarea{
  width:100%;
  height:150px;

  padding:15px;

  border:1px solid #2b3038;
  border-radius:15px;

  background:#11151b;
  color:white;

  resize:none;
  outline:none;
}

/* ================= MESSAGES ================= */

.messages{
  max-width:700px;
  margin:auto;
}

.chat{
  display:flex;
  align-items:center;
  gap:13px;

  padding:14px;

  border-bottom:1px solid #242932;

  cursor:pointer;
}

.chat .avatar-ring{
  width:55px;
  height:55px;
  margin:0;
}

.last{
  margin-top:3px;
  color:#8e96a2;
  font-size:12px;
}

/* ================= PROFILE ================= */

.profile{
  max-width:720px;
  margin:auto;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:20px;
  padding:20px 0;
}

.profile-head .avatar-ring{
  width:92px;
  height:92px;
  margin:0;
}

.profile-name{
  margin-bottom:10px;
  font-size:20px;
  font-weight:bold;
}

.stats{
  display:flex;
  gap:25px;
}

.stats b{
  display:block;
  font-size:18px;
}

.stats span{
  color:#9098a5;
  font-size:12px;
}

.bio{
  margin-bottom:18px;
  color:#b9bec8;
}

.profile-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}

.profile-grid img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
}

/* ================= BOTTOM NAV ================= */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  height:70px;

  z-index:200;

  border-top:1px solid #262b34;

  background:#080a0ef5;

  backdrop-filter:blur(20px);
}

.nav{
  width:min(700px,100%);
  height:100%;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-around;
}

.nav button{
  border:0;
  background:none;
  color:#8f97a4;

  font-size:10px;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;

  cursor:pointer;
}

.nav button span{
  font-size:23px;
}

.nav button.active{
  color:white;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .topbar{
    padding:0 10px;
  }

  .top-brand{
    font-size:19px;
  }

  .layout{
    padding:10px 7px 85px;
  }

  .post{
    border-radius:12px;
  }

  .stories{
    gap:12px;
  }

  .story{
    min-width:68px;
  }

  .avatar-ring{
    width:62px;
    height:62px;
  }

  .reel{
    border-radius:12px;
  }

  .profile-head{
    gap:14px;
  }

  .profile-head .avatar-ring{
    width:78px;
    height:78px;
  }

  .stats{
    gap:14px;
  }

  .bottom{
    height:68px;
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="login">

  <div class="login-card">

    <div class="logo">◎</div>

    <div class="brand">
      PhotoShare
    </div>

    <div class="subtitle">
      Share your moments
    </div>

    <input
      id="username"
      type="text"
      placeholder="Username or email"
      autocomplete="off"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="off"
    >

    <button
      class="primary"
      onclick="login()"
    >
      Log In
    </button>

    <div class="demo">
      Demo only — login information is not transmitted.
    </div>

  </div>

</div>


<!-- ================= APPLICATION ================= -->

<div id="app" class="hidden">

  <!-- TOP BAR -->

  <header class="topbar">

    <div class="top-brand">

      <div class="mini-logo">
        ◎
      </div>

      PhotoShare

    </div>

    <div class="top-actions">

      <button
        class="icon-btn"
        onclick="showPage('search')"
      >
        ⌕
      </button>

      <button
        class="icon-btn"
        onclick="showPage('messages')"
      >
        ♡
      </button>

    </div>

  </header>


  <main class="layout">

    <!-- ================= HOME ================= -->

    <section
      id="home"
      class="page active"
    >

      <div
        id="stories"
        class="stories"
      ></div>

      <div
        id="feed"
        class="feed"
      ></div>

    </section>


    <!-- ================= SEARCH ================= -->

    <section
      id="search"
      class="page"
    >

      <div class="section-title">
        Explore
      </div>

      <div class="searchbox">

        <input
          id="searchInput"
          placeholder="Search photos..."
          oninput="searchPhotos()"
        >

      </div>

      <div
        id="explore"
        class="explore-grid"
      ></div>

    </section>


    <!-- ================= REELS ================= -->

    <section
      id="reels"
      class="page"
    >

      <div class="section-title">
        Reels
      </div>

      <div
        id="reelsList"
        class="reels"
      ></div>

    </section>


    <!-- ================= CREATE ================= -->

    <section
      id="create"
      class="page"
    >

      <div class="section-title">
        Create Post
      </div>

      <div class="create">

        <textarea
          id="caption"
          placeholder="Write a caption..."
        ></textarea>

        <button
          class="primary"
          onclick="createPost()"
        >
          Publish Demo Post
        </button>

      </div>

    </section>


    <!-- ================= MESSAGES ================= -->

    <section
      id="messages"
      class="page"
    >

      <div class="section-title">
        Messages
      </div>

      <div
        id="messagesList"
        class="messages"
      ></div>

    </section>


    <!-- ================= PROFILE ================= -->

    <section
      id="profile"
      class="page"
    >

      <div class="profile">

        <div class="profile-head">

          <div class="avatar-ring">

            <img
              class="avatar"
              src="https://i.pravatar.cc/300?img=12"
            >

          </div>

          <div>

            <div
              id="profileName"
              class="profile-name"
            >
              Your Profile
            </div>

            <div class="stats">

              <div>
                <b>24</b>
                <span>Posts</span>
              </div>

              <div>
                <b>1.2K</b>
                <span>Followers</span>
              </div>

              <div>
                <b>318</b>
                <span>Following</span>
              </div>

            </div>

          </div>

        </div>

        <div class="bio">
          PhotoShare demo account · Exploring moments ✨
        </div>

        <div
          id="profileGrid"
          class="profile-grid"
        ></div>

      </div>

    </section>

  </main>


  <!-- ================= BOTTOM NAV ================= -->

  <nav class="bottom">

    <div class="nav">

      <button
        data-page="home"
        class="active"
        onclick="showPage('home')"
      >
        <span>⌂</span>
        Home
      </button>

      <button
        data-page="search"
        onclick="showPage('search')"
      >
        <span>⌕</span>
        Search
      </button>

      <button
        data-page="create"
        onclick="showPage('create')"
      >
        <span>⊕</span>
        Create
      </button>

      <button
        data-page="reels"
        onclick="showPage('reels')"
      >
        <span>▷</span>
        Reels
      </button>

      <button
        data-page="messages"
        onclick="showPage('messages')"
      >
        <span>♡</span>
        Messages
      </button>

      <button
        data-page="profile"
        onclick="showPage('profile')"
      >
        <span>♙</span>
        Profile
      </button>

    </div>

  </nav>

</div>


<script>

/* =====================================================
   PHOTO DATA
===================================================== */

const images = [

"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=85",

"https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1000&q=85",

"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=85",

"https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1000&q=85",

"https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1000&q=85",

"https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1000&q=85",

"https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1000&q=85",

"https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1000&q=85",

"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1000&q=85"

];

const people = [
  "Your Story",
  "User Tilly",
  "Sam",
  "Emma",
  "Daniel",
  "Christian"
];

const avatarIds = [
  12,
  32,
  14,
  47,
  68,
  5
];


/* =====================================================
   LOGIN
===================================================== */

function login(){

  const username =
    document
    .getElementById("username")
    .value
    .trim();

  if(username){

    document
    .getElementById("profileName")
    .textContent = username;

  }

  document
  .getElementById("login")
  .classList
  .add("hidden");

  document
  .getElementById("app")
  .classList
  .remove("hidden");

  showPage("home");
}


/* =====================================================
   PAGE NAVIGATION
===================================================== */

function showPage(page){

  document
  .querySelectorAll(".page")
  .forEach(function(section){

    section.classList.remove("active");

  });

  const selected =
    document.getElementById(page);

  if(selected){
    selected.classList.add("active");
  }

  document
  .querySelectorAll(".nav button")
  .forEach(function(button){

    button.classList.toggle(
      "active",
      button.dataset.page === page
    );

  });

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   STORIES
===================================================== */

function renderStories(){

  const stories =
    document.getElementById("stories");

  stories.innerHTML = "";

  people.forEach(function(person,index){

    stories.innerHTML += `

      <div
        class="story"
        onclick="alert('Story opened: ${person}')"
      >

        <div class="avatar-ring">

          <img
            class="avatar"
            src="https://i.pravatar.cc/150?img=${avatarIds[index]}"
          >

        </div>

        ${person}

      </div>

    `;

  });

}


/* =====================================================
   HOME POSTS
===================================================== */

function renderFeed(){

  const feed =
    document.getElementById("feed");

  feed.innerHTML = `

    <article class="post">

      <div class="post-head">

        <div class="avatar-ring">

          <img
            class="avatar"
            src="https://i.pravatar.cc/150?img=23"
          >

        </div>

        <div>

          <div class="post-user">
            alhdeco
          </div>

          <div class="post-time">
            22m · PhotoShare
          </div>

        </div>

        <button class="more">
          •••
        </button>

      </div>

      <img
        class="post-img"
        src="${images[0]}"
      >

      <div class="post-actions">

        <button onclick="like(this)">
          ♡
        </button>

        <button onclick="comment()">
          ◯
        </button>

        <button onclick="sharePost()">
          ➤
        </button>

        <button
          class="save"
          onclick="savePost(this)"
        >
          ♡
        </button>

      </div>

      <div class="likes">
        338 likes
      </div>

      <div class="caption">
        <b>alhdeco</b>
        Mountain evening — moments worth remembering ✨
      </div>

    </article>


    <article class="post">

      <div class="post-head">

        <div class="avatar-ring">

          <img
            class="avatar"
            src="https://i.pravatar.cc/150?img=44"
          >

        </div>

        <div>

          <div class="post-user">
            Shimcich
          </div>

          <div class="post-time">
            1h · PhotoShare
          </div>

        </div>

        <button class="more">
          •••
        </button>

      </div>

      <img
        class="post-img"
        src="${images[4]}"
      >

      <div class="post-actions">

        <button onclick="like(this)">
          ♡
        </button>

        <button onclick="comment()">
          ◯
        </button>

        <button onclick="sharePost()">
          ➤
        </button>

        <button
          class="save"
          onclick="savePost(this)"
        >
          ♡
        </button>

      </div>

      <div class="likes">
        512 likes
      </div>

      <div class="caption">
        <b>Shimcich</b>
        A quiet golden hour 🌅
      </div>

    </article>

  `;

}


/* =====================================================
   EXPLORE
===================================================== */

function renderExplore(){

  const explore =
    document.getElementById("explore");

  explore.innerHTML = "";

  images.forEach(function(image,index){

    explore.innerHTML += `

      <div
        class="tile"
        data-search="photo ${index+1}"
        onclick="openPhoto(${index})"
      >

        <img src="${image}">

      </div>

    `;

  });

}


function searchPhotos(){

  const query =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase();

  document
  .querySelectorAll(".tile")
  .forEach(function(tile){

    const text =
      tile.dataset.search;

    tile.style.display =
      text.includes(query)
      ? "block"
      : "none";

  });

}


function openPhoto(index){

  alert(
    "Photo " +
    (index + 1) +
    " opened in demo."
  );

}


/* =====================================================
   REELS
===================================================== */

function renderReels(){

  const reels =
    document.getElementById("reelsList");

  reels.innerHTML = "";

  images.slice(2,6).forEach(function(image,index){

    reels.innerHTML += `

      <div class="reel">

        <img src="${image}">

        <div class="reel-overlay">

          <b>@photoshare_creator</b>

          <br>

          Beautiful moments
          #PhotoShare

        </div>

        <div class="reel-actions">

          <button onclick="like(this)">
            ♡
          </button>

          <button onclick="comment()">
            ◯
          </button>

          <button onclick="sharePost()">
            ➤
          </button>

        </div>

      </div>

    `;

  });

}


/* =====================================================
   MESSAGES
===================================================== */

function renderMessages(){

  const messages =
    document.getElementById("messagesList");

  messages.innerHTML = "";

  people.slice(1).forEach(function(person,index){

    messages.innerHTML += `

      <div
        class="chat"
        onclick="openChat('${person}')"
      >

        <div class="avatar-ring">

          <img
            class="avatar"
            src="https://i.pravatar.cc/150?img=${avatarIds[index+1]}"
          >

        </div>

        <div>

          <b>${person}</b>

          <div class="last">
            ${[
              "That looks amazing!",
              "See you soon ✨",
              "Nice photo!",
              "Sent a photo",
              "Thank you!"
            ][index]}
          </div>

        </div>

      </div>

    `;

  });

}


function openChat(name){

  alert(
    "Demo chat opened with " +
    name
  );

}


/* =====================================================
   PROFILE
===================================================== */

function renderProfile(){

  const grid =
    document.getElementById("profileGrid");

  grid.innerHTML = "";

  images.slice(0,6).forEach(function(image){

    grid.innerHTML += `

      <img src="${image}">

    `;

  });

}


/* =====================================================
   CREATE POST
===================================================== */

function createPost(){

  const caption =
    document
    .getElementById("caption")
    .value
    .trim();

  if(!caption){

    alert("Write a caption first.");

    return;
  }

  alert(
    "Demo post published!\n\n" +
    caption
  );

  document
  .getElementById("caption")
  .value = "";

  showPage("home");

}


/* =====================================================
   ACTIONS
===================================================== */

function like(button){

  if(button.textContent.trim() === "♡"){

    button.textContent = "♥";

  }else{

    button.textContent = "♡";

  }

}


function savePost(button){

  if(button.textContent.trim() === "♡"){

    button.textContent = "🔖";

  }else{

    button.textContent = "♡";

  }

}


function comment(){

  alert(
    "Demo comment panel.\n" +
    "This can be connected to a backend later."
  );

}


function sharePost(){

  alert(
    "Demo share menu opened."
  );

}

renderStories();

renderExplore();

renderProfile();
