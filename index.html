<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>PhotoShare Security Training</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#000;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}


/* =====================================================
   LOGIN PAGE
===================================================== */

#loginPage{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        linear-gradient(
            135deg,
            #fdf2f8,
            #f5f3ff,
            #fff
        );

    color:#222;
}

.loginCard{

    width:100%;

    max-width:390px;

    background:#fff;

    border:1px solid #ddd;

    border-radius:10px;

    padding:32px 28px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.10);
}

.loginLogo{

    text-align:center;

    font-family:cursive;

    font-size:42px;

    font-weight:bold;

    margin-bottom:8px;
}

.demoTitle{

    text-align:center;

    color:#777;

    font-size:10px;

    font-weight:bold;

    letter-spacing:.7px;

    margin-bottom:25px;
}

.input{

    width:100%;

    height:46px;

    border:1px solid #ddd;

    border-radius:6px;

    background:#fafafa;

    padding:0 12px;

    margin-bottom:10px;

    outline:none;

    font-size:13px;
}

.input:focus{

    border-color:#999;

}

.passwordBox{

    position:relative;
}

.passwordBox .input{

    padding-right:65px;
}

.showPassword{

    position:absolute;

    right:5px;

    top:0;

    height:46px;

    padding:0 10px;

    border:0;

    background:none;

    font-weight:bold;

    cursor:pointer;
}

.loginButton{

    width:100%;

    height:45px;

    border:0;

    border-radius:7px;

    background:
        linear-gradient(
            90deg,
            #833ab4,
            #e1306c,
            #fd1d1d,
            #f77737
        );

    color:#fff;

    font-weight:bold;

    font-size:14px;

    cursor:pointer;

    margin-top:3px;
}

.loginButton:active{

    transform:scale(.99);
}

.trainingNotice{

    margin-top:18px;

    padding:13px;

    border-radius:8px;

    background:#fff7ed;

    color:#7c2d12;

    font-size:11px;

    line-height:1.55;
}


/* =====================================================
   MAIN APP
===================================================== */

#app{

    display:none;

    min-height:100vh;

    background:#000;

    color:#fff;

    padding-bottom:70px;
}

.appContainer{

    width:100%;

    max-width:600px;

    margin:auto;

    background:#000;
}


/* =====================================================
   TOP HEADER
===================================================== */

.topHeader{

    height:60px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 15px;

    background:#000;

    border-bottom:1px solid #1d1d1d;

    position:sticky;

    top:0;

    z-index:50;
}

.headerButton{

    width:35px;

    height:35px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:none;

    border:0;

    color:#fff;

    font-size:28px;

    cursor:pointer;
}

.appLogo{

    font-family:cursive;

    font-size:28px;

    font-weight:bold;
}


/* =====================================================
   STORIES
===================================================== */

.stories{

    width:100%;

    height:112px;

    display:flex;

    gap:15px;

    overflow-x:auto;

    padding:11px 13px;

    border-bottom:1px solid #1d1d1d;
}

.stories::-webkit-scrollbar{

    display:none;
}

.story{

    min-width:67px;

    width:67px;

    text-align:center;

    font-size:10px;

    color:#eee;

    overflow:hidden;
}

.storyRing{

    width:66px;

    height:66px;

    padding:3px;

    border-radius:50%;

    background:
        linear-gradient(
            45deg,
            #feda75,
            #fa7e1e,
            #d62976,
            #962fbf,
            #4f5bd5
        );

    margin-bottom:5px;
}

.storyInside{

    width:100%;

    height:100%;

    border-radius:50%;

    border:3px solid #000;

    background:#252525;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:27px;
}


/* =====================================================
   POST
===================================================== */

.post{

    width:100%;

    background:#000;

    border-bottom:1px solid #1d1d1d;
}

.postHeader{

    height:58px;

    display:flex;

    align-items:center;

    padding:7px 12px;
}

.avatar{

    width:40px;

    height:40px;

    border-radius:50%;

    padding:2px;

    background:
        linear-gradient(
            45deg,
            #feda75,
            #fa7e1e,
            #d62976,
            #962fbf
        );
}

.avatarInside{

    width:100%;

    height:100%;

    border-radius:50%;

    background:#222;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:21px;
}

.postUsername{

    margin-left:10px;

    font-size:13px;

    font-weight:bold;
}

.verified{

    color:#3797ff;

    font-size:10px;
}

.postMore{

    margin-left:auto;

    color:#fff;

    background:none;

    border:0;

    font-size:19px;

    cursor:pointer;
}


/* =====================================================
   POST VISUAL 1
===================================================== */

.postVisual{

    width:100%;

    aspect-ratio:1/1;

    position:relative;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:
        radial-gradient(
            circle at 50% 45%,
            #155e75 0%,
            #0c4a6e 20%,
            #082f49 45%,
            #020617 70%,
            #000 100%
        );
}

.postVisual:before{

    content:"";

    position:absolute;

    width:48%;

    height:70%;

    border-radius:50%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,0,0,.7),
            transparent
        );

    filter:blur(15px);
}

.movieContent{

    position:relative;

    z-index:2;
}

.movieTitle{

    color:#ff2929;

    font-size:38px;

    font-weight:900;

    letter-spacing:2px;

    text-shadow:
        0 3px 7px #000;
}

.movieText{

    margin-top:16px;

    color:#ffe600;

    font-size:17px;

    line-height:1.25;

    font-weight:900;

    text-shadow:
        0 2px 5px #000;
}


/* =====================================================
   POST VISUAL 2
===================================================== */

.techVisual{

    width:100%;

    aspect-ratio:1/1;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    overflow:hidden;

    background:
        radial-gradient(
            circle,
            #312e81,
            #172554 45%,
            #020617 80%
        );
}

.techCircle{

    width:210px;

    height:210px;

    border-radius:50%;

    border:2px solid rgba(255,255,255,.25);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:90px;

    box-shadow:
        0 0 70px rgba(99,102,241,.35);
}

.techText{

    position:absolute;

    bottom:30px;

    text-align:center;

    font-size:18px;

    font-weight:bold;
}


/* =====================================================
   REEL
===================================================== */

.reelVisual{

    width:100%;

    height:520px;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    background:
        linear-gradient(
            160deg,
            #020617,
            #312e81,
            #831843
        );
}

.reelCenter{

    text-align:center;

    font-size:85px;
}

.reelLabel{

    margin-top:15px;

    font-size:19px;

    font-weight:bold;
}

.reelSide{

    position:absolute;

    right:13px;

    bottom:25px;

    display:flex;

    flex-direction:column;

    gap:20px;

    text-align:center;

    font-size:27px;
}

.reelSide small{

    display:block;

    font-size:10px;

    color:#fff;
}


/* =====================================================
   ACTION BUTTONS
===================================================== */

.actions{

    height:52px;

    display:flex;

    align-items:center;

    gap:18px;

    padding:5px 12px;
}

.actionButton{

    border:0;

    background:none;

    color:#fff;

    font-size:27px;

    cursor:pointer;

    padding:0;
}

.actionButton.liked{

    color:#ed4956;
}

.actionButton.saved{

    color:#fff;
}

.saveButton{

    margin-left:auto;
}


/* =====================================================
   CAPTION
===================================================== */

.caption{

    padding:0 12px 16px;

    font-size:13px;

    line-height:1.55;
}

.likes{

    font-weight:bold;

    margin-bottom:4px;
}

.captionUser{

    font-weight:bold;
}

.commentText{

    color:#777;

    margin-top:4px;
}


/* =====================================================
   EXPLORE
===================================================== */

.exploreTitle{

    padding:18px 13px 10px;

    font-size:20px;

    font-weight:bold;
}

.exploreGrid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:3px;
}

.exploreItem{

    aspect-ratio:1/1;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:48px;

    background:
        linear-gradient(
            135deg,
            #172554,
            #831843
        );
}

.exploreItem:nth-child(2n){

    background:
        linear-gradient(
            135deg,
            #164e63,
            #312e81
        );
}


/* =====================================================
   PROFILE
===================================================== */

#profile{

    display:none;

    padding:20px 15px;
}

.profileHeader{

    display:flex;

    align-items:center;

    gap:20px;
}

.profileAvatar{

    width:80px;

    height:80px;

    border-radius:50%;

    background:#333;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:40px;
}

.profileName{

    font-size:18px;

    font-weight:bold;
}

.profileStats{

    display:flex;

    gap:25px;

    margin-top:12px;

    font-size:12px;
}

.profileBio{

    margin-top:18px;

    font-size:13px;

    line-height:1.5;
}


/* =====================================================
   SECURITY NOTICE
===================================================== */

.securityNotice{

    margin:16px 12px;

    padding:15px;

    border-radius:9px;

    background:#151515;

    border:1px solid #292929;

    color:#aaa;

    font-size:11px;

    line-height:1.6;
}


/* =====================================================
   LOGOUT
===================================================== */

.logout{

    width:calc(100% - 24px);

    margin:0 12px 20px;

    padding:12px;

    border:1px solid #444;

    border-radius:7px;

    background:#111;

    color:#fff;

    font-weight:bold;

    cursor:pointer;
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottomNav{

    position:fixed;

    left:0;

    right:0;

    bottom:0;

    height:62px;

    background:#000;

    border-top:1px solid #222;

    display:flex;

    align-items:center;

    justify-content:space-around;

    z-index:100;
}

.navButton{

    width:45px;

    height:45px;

    border:0;

    background:none;

    color:#fff;

    font-size:25px;

    cursor:pointer;
}

.navButton.active{

    font-weight:bold;
}

.navProfile{

    width:28px;

    height:28
