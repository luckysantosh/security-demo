<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Awareness Demo</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f8fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(380px, 90%);
      padding: 28px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      background: #fff3cd;
      color: #664d03;
      font-size: 13px;
      font-weight: 600;
    }

    input, button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: 0;
      background: #24292f;
      color: white;
      font-weight: 600;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #e8f5e9;
      color: #245b2a;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="badge">SECURITY AWARENESS DEMO</div>

    <h1>Fictional Login</h1>

    <p>This is a controlled security simulation.</p>

    <form id="demo">
      <input
        type="text"
        placeholder="Demo username"
        autocomplete="off"
      >

      <input
        type="password"
        placeholder="Demo password"
        autocomplete="off"
      >

      <button type="submit">Sign in</button>
    </form>

    <div id="result">
      <strong>Simulation complete.</strong>
      <br><br>
      Nothing was transmitted or stored.
    </div>
  </main>

  <script>
    document.querySelector("#demo").addEventListener("submit", function(event) {
      event.preventDefault();

      this.style.display = "none";
      document.querySelector("#result").style.display = "block";
    });
  </script>
</body>
</html>
