<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PhotoShare Training</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
}

/* LOGIN */

#loginPage{
    min-height:100vh;
    background:#fafafa;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.loginBox{
    width:100%;
    max-width:380px;
    background:white;
    border:1px solid #ddd;
    padding:30px;
    border-radius:8px;
}

.loginLogo{
    text-align:center;
    font-family:cursive;
    font-size:42px;
    font-weight:bold;
    margin-bottom:10px;
}

.training{
    text-align:center;
    color:#777;
    font-size:11px;
    margin-bottom:25px;
}

.input{
    width:100%;
    height:45px;
    padding:0 12px;
    margin-bottom:10px;
    border:1px solid #ddd;
    border-radius:6px;
    background:#fafafa;
}

.passwordArea{
    position:relative;
}

.passwordArea .input{
    padding-right:65px;
}

.showBtn{
    position:absolute;
    right:5px;
    top:0;
    height:45px;
    border:0;
    background:transparent;
    font-weight:bold;
}

.loginBtn{
    width:100%;
    height:45px;
    border:0;
    border-radius:7px;
    color:white;
    font-weight:bold;
    background:linear-gradient(
        90deg,
        #833ab4,
        #e1306c,
        #fd1d1d,
        #f77737
    );
}

.notice{
    margin-top:18px;
    padding:12px;
    background:#fff7ed;
    color:#7c2d12;
    border-radius:7px;
    font-size:11px;
    line-height:1.5;
}


/* APP */

#app{
    display:none;
    min-height:100vh;
    background:#000;
    color:#fff;
}

.feed{
    width:100%;
    max-width:520px;
    margin:auto;
    padding-bottom:70px;
}


/* TOP */

.top{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    background:#000;
    border-bottom:1px solid #222;
    position:sticky;
    top:0;
    z-index:10;
}

.instagram{
    font-family:cursive;
    font-size:28px;
    font-weight:bold;
}

.topIcon{
    font-size:27px;
}


/* STORIES */

.stories{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding:12px;
    height:108px;
    border-bottom:1px solid #181818;
}

.story{
    min-width:65px;
    text-align:center;
    font-size:10px;
}

.storyRing{
    width:64px;
    height:64px;
    padding:3px;
    border-radius:50%;
    background:linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
    );
    margin-bottom:5px;
}

.storyPhoto{
    width:100%;
    height:100%;
    border-radius:50%;
    background:#333;
    border:3px solid #000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}


/* POST */

.post{
    border-bottom:1px solid #222;
}

.postHeader{
    height:55px;
    display:flex;
    align-items:center;
    padding:7px 12px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:linear-gradient(
        45deg,
        #feda75,
        #d62976,
        #4f5bd5
    );
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.user{
    margin-left:9px;
    font-size:13px;
    font-weight:bold;
}

.more{
    margin-left:auto;
    font-size:20px;
}


/* IMAGE */

.postImage{
    width:100%;
    aspect-ratio:1/1;
    background:
        radial-gradient(
            circle at center,
            #075985 0%,
            #082f49 28%,
            #020617 60%,
            #000 100%
        );
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.postTitle{
    font-size:34px;
    font-weight:900;
    color:#ff2929;
    text-shadow:0 3px 8px #000;
}

.postSub{
    margin-top:15px;
    font-size:17px;
    font-weight:bold;
    color:#ffe600;
}


/* ACTIONS */

.actions{
    display:flex;
    gap:18px;
    padding:10px 12px 5px;
    font-size:26px;
}

.save{
    margin-left:auto;
}


/* CAPTION */

.caption{
    padding:0 12px 15px;
    font-size:13px;
    line-height:1.5;
}

.likes{
    font-weight:bold;
    margin-bottom:5px;
}

.gray{
    color:#888;
}


/* SECOND POST */

.secondImage{
    width:100%;
    aspect-ratio:1/1;
    background:linear-gradient(
        135deg,
        #111827,
        #312e81,
        #831843
    );
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:80px;
}


/* SECURITY */

.security{
    margin:15px 12px;
    padding:14px;
    border:1px solid #292929;
    border-radius:8px;
    background:#111;
    color:#bbb;
    font-size:11px;
    line-height:1.5;
}


/* LOGOUT */

.logout{
    width:calc(100% - 24px);
    margin:0 12px 20px;
    padding:11px;
    border:1px solid #444;
    border-radius:7px;
    background:#111;
    color:white;
    font-weight:bold;
}


/* BOTTOM */

.bottom{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:60px;
    background:#000;
    border-top:1px solid #222;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:20;
}

.bottom span{
    font-size:26px;
}
</style>
</head>

<body>

    <div class="loginBox">

        <div class="loginLogo">
            Instagram
        </div>
